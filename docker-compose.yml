name: truth-hunter

services:
  truthhunter:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Truth Hunter}
      APP_VERSION: ${APP_VERSION:-0.9.0-rc2}
      APP_SECRET: ${APP_SECRET:-development-only-change-me}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_TRUSTED_HOSTS: ${APP_TRUSTED_HOSTS:-localhost,127.0.0.1,truthhunter}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-truthhunter}:${POSTGRES_PASSWORD:-development-only-change-me}@postgres:5432/${POSTGRES_DB:-truthhunter}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-groq,gemini,openrouter,deepseek}
      ALLOW_PAID_AI_FALLBACK: ${ALLOW_PAID_AI_FALLBACK:-false}
      AI_MAX_PAID_FALLBACK_CALLS: ${AI_MAX_PAID_FALLBACK_CALLS:-0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SEARXNG_URL: http://searxng:8080
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_MAX_QUERIES_PER_INVESTIGATION: ${BRAVE_SEARCH_MAX_QUERIES_PER_INVESTIGATION:-2}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-20}
      SEARCH_DELAY_SECONDS: ${SEARCH_DELAY_SECONDS:-1.0}
      SEARCH_RETRY_ATTEMPTS: ${SEARCH_RETRY_ATTEMPTS:-1}
      SOURCE_USEFUL_LIMIT: ${SOURCE_USEFUL_LIMIT:-15}
      SOURCE_EVALUATION_LIMIT: ${SOURCE_EVALUATION_LIMIT:-15}
      AI_SOURCE_TEXT_MAX_CHARS: ${AI_SOURCE_TEXT_MAX_CHARS:-12000}
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-15}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-2000000}
      FETCH_REDIRECT_LIMIT: ${FETCH_REDIRECT_LIMIT:-4}
      IMAGE_UPLOAD_MAX_BYTES: ${IMAGE_UPLOAD_MAX_BYTES:-8000000}
      IMAGE_UPLOAD_MAX_PIXELS: ${IMAGE_UPLOAD_MAX_PIXELS:-20000000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      SUPPORT_URL: ${SUPPORT_URL:-}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      EMAIL_TOKEN_MAX_AGE_SECONDS: ${EMAIL_TOKEN_MAX_AGE_SECONDS:-86400}
      RESET_TOKEN_MAX_AGE_SECONDS: ${RESET_TOKEN_MAX_AGE_SECONDS:-3600}
      AUTH_ATTEMPT_LIMIT: ${AUTH_ATTEMPT_LIMIT:-8}
      AUTH_ATTEMPT_WINDOW_SECONDS: ${AUTH_ATTEMPT_WINDOW_SECONDS:-900}
      PUBLIC_RATE_LIMITS_ENABLED: ${PUBLIC_RATE_LIMITS_ENABLED:-true}
      CLAIM_SUBMISSION_LIMIT: ${CLAIM_SUBMISSION_LIMIT:-10}
      INVESTIGATION_START_LIMIT: ${INVESTIGATION_START_LIMIT:-5}
      PUBLIC_REPORT_LIMIT: ${PUBLIC_REPORT_LIMIT:-10}
      PUBLIC_LIMIT_WINDOW_SECONDS: ${PUBLIC_LIMIT_WINDOW_SECONDS:-3600}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_TIMEOUT_SECONDS: ${TURNSTILE_TIMEOUT_SECONDS:-5}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_ACCESS_MAX_AGE_SECONDS: ${ADMIN_ACCESS_MAX_AGE_SECONDS:-600}
      ADMIN_SESSION_MAX_AGE_SECONDS: ${ADMIN_SESSION_MAX_AGE_SECONDS:-1800}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - truthhunter_internal

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truthhunter}
      POSTGRES_USER: ${POSTGRES_USER:-truthhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - truthhunter_internal

  searxng:
    image: searxng/searxng@sha256:374c5da46d26960bf1132834d05bc2ef2ae57232f7a490e4eac8c8b640fa783d
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-development-only-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    restart: unless-stopped
    networks:
      - truthhunter_internal

  caddy:
    image: caddy:2.10-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      truthhunter:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - truthhunter_internal

  backup:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-truthhunter}
      POSTGRES_USER: ${POSTGRES_USER:-truthhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - truthhunter_internal

networks:
  truthhunter_internal:
    driver: bridge

volumes:
  postgres_data:
  searxng_data:
  caddy_data:
  caddy_config:
