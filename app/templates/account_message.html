{% extends "base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}
{% block content %}<section class="page-card auth-card"><h1 class="page-title">{{ title }}</h1><p class="lead">{{ message }}</p>{% if development_url %}<div class="development-link"><strong>{{ a.development_link }}</strong><p><a href="{{ development_url }}">{{ a.continue_securely }}</a></p><small>{{ a.development_note }}</small></div>{% endif %}</section>{% endblock %}
