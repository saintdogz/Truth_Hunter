{% extends "base.html" %}
{% block title %}Register · {{ app_name }}{% endblock %}
{% block content %}<section class="page-card auth-card"><p class="signal-line"><span></span>ACCOUNT</p><h1 class="page-title">Create account</h1>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post" action="/register" class="account-form"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Email<input type="email" name="email" value="{{ email }}" autocomplete="email" required maxlength="320"></label><label>Password<input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="256"></label><small>Use at least 12 characters.</small><button class="button primary wide" type="submit">Create account</button></form><p class="muted">Already registered? <a href="/login">Sign in</a>.</p></section>{% endblock %}
