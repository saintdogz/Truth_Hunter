{% extends "base.html" %}
{% block title %}Reset password · {{ app_name }}{% endblock %}
{% block content %}<section class="page-card auth-card"><h1 class="page-title">Reset password</h1>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post" action="/forgot-password" class="account-form"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Email<input type="email" name="email" autocomplete="email" required></label><button class="button primary wide" type="submit">Request reset link</button></form></section>{% endblock %}
