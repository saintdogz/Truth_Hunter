{% extends "base.html" %}
{% block title %}{{ a.account }} · {{ app_name }}{% endblock %}
{% block content %}<section class="page-card auth-card"><p class="signal-line"><span></span>{{ a.account|upper }}</p><h1 class="page-title">{{ a.your_account }}</h1><p>{{ current_user.email }}</p><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="button secondary" type="submit">{{ a.sign_out }}</button></form><hr><h2>{{ a.delete_title }}</h2><p class="muted">{{ a.delete_note }}</p>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post" action="/account/delete" class="account-form"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>{{ a.delete_confirm }}<input name="confirmation" autocomplete="off" required></label><button class="button danger" type="submit">{{ a.delete_button }}</button></form></section>{% endblock %}
