{% extends "base.html" %}
{% block title %}Choose password · {{ app_name }}{% endblock %}
{% block content %}<section class="page-card auth-card"><h1 class="page-title">Choose a new password</h1>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post" action="/reset-password" class="account-form"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><label>New password<input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="256"></label><button class="button primary wide" type="submit">Update password</button></form></section>{% endblock %}
