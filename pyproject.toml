[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "truth-hunter"
version = "0.1.0"
description = "Truth Hunter evidence-investigation service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "lingua-language-detector>=2.1,<3",
  "openai>=1.99,<3",
  "pillow>=11.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pytesseract>=0.3.13,<1",
  "sqlalchemy>=2.0,<3",
  "itsdangerous>=2.2,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "database: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["TRUTH_HUNTER_SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations"]
